 */

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    //modCompileOnly "com.cobblemon:neoforge:${cobblemon_version}"
    modCompileOnly "com.cobblemon:fabric:${cobblemon_version}"

    modImplementation("io.wispforest:accessories-common:${accessories_version}+${minecraft_version}-mojmap")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

